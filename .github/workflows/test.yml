name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin a stable npm
        # The runner's bundled npm trips its arborist bug ('Cannot read properties of
        # null (reading edgesOut)') on this dependency set.
        run: npm install --global npm@10 --no-audit --no-fund

      - name: Install app dependencies
        # `npm install` resolves this dependency set through an arborist code path that
        # throws 'Cannot read properties of null (reading edgesOut)' on the runner, so CI
        # installs strictly from the committed lockfile instead.
        # optionalDependencies (better-sqlite3) are skipped: the runtime falls back to sql.js.
        run: npm ci --no-audit --no-fund

      # vitest is a root devDependency: `npm --prefix tests install` and a second
      # `--no-save` install both hit npm's 'edgesOut' bug in CI, so the repo keeps a
      # single dependency tree.

      - name: Run unit tests (baseline gate, no new failures)
        run: node tests/scripts/check-baseline.mjs