name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      # vitest is a root devDependency: `npm --prefix tests install` and a second
      # `--no-save` install both hit npm's 'edgesOut' bug in CI, so the repo keeps a
      # single dependency tree.

      - name: Run unit tests (baseline gate, no new failures)
        run: node tests/scripts/check-baseline.mjs