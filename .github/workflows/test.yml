name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install test dependencies
        run: npm --prefix tests install --no-audit --no-fund

      - name: Run unit tests (baseline gate: no new failures)
        run: node tests/scripts/check-baseline.mjs